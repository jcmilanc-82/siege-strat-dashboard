<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Estrategias de Siege</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos opcionales para ocultar/mostrar elementos */
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-4">Tablero de Estrategias de Siege</h1>

    <!-- Seleccionar Mapa y Sitio -->
    <div class="mb-4">
      <label class="block mb-2">Selecciona el Mapa:</label>
      <select id="map-select" class="w-full p-2 rounded bg-gray-800 text-white">
        <option value="clubhouse">Clubhouse</option>
        <option value="oregon">Oregon</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block mb-2">Selecciona el Sitio:</label>
      <select id="site-select" class="w-full p-2 rounded bg-gray-800 text-white">
        <!-- Se llenará dinámicamente -->
      </select>
    </div>

    <!-- Detalles de Estrategia -->
    <div id="strat-container" class="bg-gray-800 p-4 rounded-lg shadow-lg hidden">
      <h2 id="strat-title" class="text-xl font-semibold mb-2"></h2>
      <p id="strat-description" class="mb-4"></p>

      <table class="w-full table-auto text-sm">
        <thead>
          <tr class="bg-gray-700">
            <th class="p-2 text-left">Operador</th>
            <th class="p-2 text-left">Rol</th>
            <th class="p-2 text-left">Tareas</th>
          </tr>
        </thead>
        <tbody id="strat-operators"></tbody>
      </table>

      <div class="mt-4">
        <h3 class="font-semibold mb-1">Video de Referencia:</h3>
        <iframe id="strat-video" class="w-full aspect-video rounded" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // Datos de Estrategias (Solo en español)
    const strats = {
      clubhouse: {
        "cctv_cache": {
          es: {
            title: "Configuración Predeterminada",
            description: "Configuración básica para la defensa de CCTV y Cache en Clubhouse.",
            videoId: "YOUTUBE_VIDEO_ID_1",
            operators: [
              { name: "Castle", role: "Ancla", tasks: "Refuerza la pared de Construction, coloca Castle en la puerta de Cache, coloca un escudo en Cache" },
              { name: "Jäger", role: "Flexible", tasks: "ADS en la parte superior de las escaleras rojas, patrullar temprano en Construction" },
              { name: "Mute", role: "Ancla", tasks: "Coloca bloqueadores de drones, refuerza la pared de CCTV" },
              { name: "Bandit", role: "Negación", tasks: "Trick en la pared de CCTV, coloca cables en las escaleras rojas" },
              { name: "Smoke", role: "Ancla", tasks: "Escudo en Cache, rota de Construction a Cache, posición de ancla profunda" }
            ]
          }
        }
      },
      oregon: {
        "kidnap": {
          es: {
            title: "Configuración de Defensa de Kidnap",
            description: "Estrategia de defensa para el sitio Kidnap en Oregon.",
            videoId: "YOUTUBE_VIDEO_ID_2",
            operators: [
              { name: "Lesion", role: "Ancla", tasks: "Coloca trampas en puertas y ventanas, mantiene la posición cerca de la bomba" },
              { name: "Mira", role: "Ancla", tasks: "Posiciónate en el sitio y vigila la entrada principal" },
              { name: "Doc", role: "Soporte", tasks: "Mantén la vigilancia sobre las entradas y revive a compañeros de ser necesario" },
              { name: "Rook", role: "Soporte", tasks: "Coloca la armadura en el sitio y cubre las entradas" },
              { name: "Bandit", role: "Negación", tasks: "Trick en paredes electrificadas, refuerza la bomba" }
            ]
          }
        }
      }
    };

    const mapSelect = document.getElementById("map-select");
    const siteSelect = document.getElementById("site-select");
    const stratContainer = document.getElementById("strat-container");
    const stratTitle = document.getElementById("strat-title");
    const stratDescription = document.getElementById("strat-description");
    const stratOperators = document.getElementById("strat-operators");
    const stratVideo = document.getElementById("strat-video");

    function populateSites() {
      const selectedMap = mapSelect.value;
      siteSelect.innerHTML = "";
      const sites = Object.keys(strats[selectedMap]);
      sites.forEach(site => {
        const option = document.createElement("option");
        option.value = site;
        option.textContent = site.replace("_", " & ").replace(/\b\w/g, c => c.toUpperCase());
        siteSelect.appendChild(option);
      });
      showStrat();
    }

    function showStrat() {
      const map = mapSelect.value;
      const site = siteSelect.value;
      const strat = strats[map][site].es; // Solo en español

      stratTitle.textContent = `Estrategia: ${strat.title}`;
      stratDescription.textContent = strat.description;
      stratOperators.innerHTML = "";
      strat.operators.forEach(op => {
        const row = `<tr class='border-t border-gray-600'><td class='p-2'>${op.name}</td><td class='p-2'>${op.role}</td><td class='p-2'>${op.tasks}</td></tr>`;
        stratOperators.innerHTML += row;
      });
      stratVideo.src = `https://www.youtube.com/embed/${strat.videoId}`;
      stratContainer.classList.remove("hidden");
    }

    mapSelect.addEventListener("change", populateSites);
    siteSelect.addEventListener("change", showStrat);

    populateSites(); // Cargar el mapa y sitio inicial
  </script>
</body>
</html>
